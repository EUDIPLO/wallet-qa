name: Publish Docker images
# Builds the two images of the stack and pushes them to GitHub's container registry:
#
#   ghcr.io/eudiplo/wallet-qa          Wallet QA (Dockerfile)
#   ghcr.io/eudiplo/wallet-qa-eudiplo  EUDIPLO with the tenant config (Dockerfile.eudiplo)
#
# Tags: `main` and `sha-<commit>` for every push to main; `1.2.3`, `1.2` and `latest` for a
# tag `v1.2.3`. Run it by hand to rebuild on the current EUDIPLO base image, or on another
# EUDIPLO version.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      eudiplo_version:
        description: Tag of ghcr.io/eudiplo/eudiplo that wallet-qa-eudiplo is built on
        default: main
permissions:
  contents: read
# A newer push to the same ref replaces a build that is still running.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/eudiplo/wallet-qa
            dockerfile: Dockerfile
            title: Wallet QA
          - image: ghcr.io/eudiplo/wallet-qa-eudiplo
            dockerfile: Dockerfile.eudiplo
            title: EUDIPLO with the Wallet QA tenant config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Always fetch the base image: ghcr.io/eudiplo/eudiplo:main is a moving tag.
          pull: true
          push: true
          # Only Dockerfile.eudiplo declares this argument; the other build ignores it.
          build-args: |
            EUDIPLO_BASE_IMAGE_TAG=${{ inputs.eudiplo_version || 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
