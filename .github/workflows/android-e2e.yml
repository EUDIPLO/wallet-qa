# Automated Android wallet tests. A thin wrapper: everything it runs lives in
# automation/android/ so that directory can move to another repository.
#
# Stage 1 (current): Wallet QA stack + smoke, Android emulator with KVM, adb reverse, and a
# TLS reachability check from inside the emulator. The wallet and Appium follow.
name: Android wallet E2E
on:
  workflow_dispatch:
  push:
    branches: ['automation/**']
    paths: ['automation/android/**', '.github/workflows/android-e2e.yml']
permissions:
  contents: read
concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARTIFACTS_DIR: ${{ github.workspace }}/automation/android/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - run: npm install -g pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Start the Wallet QA stack
        run: automation/android/scripts/stack-up.sh
      - name: Smoke test (every scenario starts)
        run: pnpm smoke
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator reaches the stack
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: automation/android/scripts/emulator-check.sh
      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          docker compose -p wallet-qa logs --no-color > "$ARTIFACTS_DIR/stack.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-e2e-artifacts
          path: automation/android/artifacts
          retention-days: 14
