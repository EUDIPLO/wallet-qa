# Automated Android wallet tests. A thin wrapper: everything it runs lives in
# automation/android/ so that directory can move to another repository.
#
#   wallet-apk  builds the EU reference wallet (dev flavor) with the Wallet QA patch; the APK is
#               cached on the patch, the build script and the two Wallet QA trust roots.
#   e2e         starts the Wallet QA stack, boots an Android emulator, maps localhost:8443/3443
#               into it and runs the Appium tests (onboarding, I-PID-SDJWT, P-PID-ONE-SDJWT).
name: Android wallet E2E
on:
  workflow_dispatch:
  push:
    branches: ['automation/**']
    paths:
      - 'automation/android/**'
      - '.github/workflows/android-e2e.yml'
      - 'eudiplo-config/**'
      - 'config/**'
      - 'src/**'
      - 'Dockerfile.eudiplo'
      - 'docker-compose.yml'
permissions:
  contents: read
concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wallet-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore the APK built from the same inputs
        id: apk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: automation/android/build/wallet-dev-debug.apk
          key: wallet-apk-${{ hashFiles('automation/android/wallet/**', 'automation/android/scripts/build-wallet.sh', 'deploy/tls/root.crt', 'public/trust/wallet-qa-test-root.der') }}
      - name: Free disk space
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.apk-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.apk-cache.outputs.cache-hit != 'true'
        with:
          cache-read-only: false
      - name: Build the patched wallet
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: automation/android/scripts/build-wallet.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallet-dev-debug-apk
          path: automation/android/build/wallet-dev-debug.apk
          retention-days: 7
          if-no-files-found: error

  e2e:
    needs: wallet-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARTIFACTS_DIR: ${{ github.workspace }}/automation/android/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - run: npm install -g pnpm@11.20.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the automation package
        working-directory: automation/android
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wallet-dev-debug-apk
          path: automation/android/build
      - name: Start the Wallet QA stack
        run: automation/android/scripts/stack-up.sh
      - name: Smoke test (every scenario starts)
        run: pnpm smoke
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, wallet and Appium tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: automation/android/scripts/emulator-check.sh && automation/android/scripts/run-tests.sh
      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          docker compose -p wallet-qa logs --no-color > "$ARTIFACTS_DIR/stack.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-e2e-artifacts
          path: automation/android/artifacts
          retention-days: 14
