# Paradym's app PIN, on its own number pad ("Gib deine App-PIN ein" to unlock,
# "Sende Daten mit deinem PIN-Code" to confirm a presentation).
# With WALLET_PIN set, taps its digits. Without it, waits up to two minutes for a person to
# enter the PIN on the phone.
appId: ${WALLET_APP_ID}
---
- runFlow:
    when:
      true: ${typeof WALLET_PIN !== 'undefined'}
    commands:
      - evalScript: "${output.pin = { digits: String(WALLET_PIN).split(''), next: 0 }}"
      - repeat:
          while:
            true: ${output.pin.next < output.pin.digits.length}
          commands:
            - tapOn:
                text: ${output.pin.digits[output.pin.next]}
                index: 0
            - evalScript: ${output.pin.next = output.pin.next + 1}
- extendedWaitUntil:
    notVisible: '(Gib deine App-PIN ein|Sende Daten mit deinem PIN-Code)'
    timeout: 120000
