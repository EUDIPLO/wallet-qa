# Hosted Wallet QA, e.g. conformance.eudiplo.dev. Applied on top of docker-compose.yml:
#
#   docker compose -p wallet-qa --env-file .env.hosted \
#     -f docker-compose.yml -f docker-compose.hosted.yml up --build -d --wait
#
# Differences from the local stack:
#   - Caddy serves two public hostnames with Let's Encrypt certificates (deploy/Caddyfile.hosted),
#     puts the Wallet QA page and API behind basic auth, and blocks EUDIPLO's management API
#     from outside.
#   - EUDIPLO takes the tenant config from git, with the deployment's overlay
#     (QA_FIXTURES_DIR/overlay: key chains for EUDIPLO_HOST, own access and registration
#     certificates) applied on top; Wallet QA serves QA_FIXTURES_DIR/public as /trust.
# See docs/hosting.md.
services:
  caddy:
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp'
      # EUDIPLO's plain port stays on loopback for `pnpm smoke` on the host.
      - '127.0.0.1:${EUDIPLO_HOST_PORT:-3000}:3000'
    environment:
      QA_HOST: ${QA_HOST:?Set QA_HOST}
      EUDIPLO_HOST: ${EUDIPLO_HOST:?Set EUDIPLO_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      QA_AUTH_USER: ${QA_AUTH_USER:?Set QA_AUTH_USER}
      QA_AUTH_HASH: ${QA_AUTH_HASH:?Set QA_AUTH_HASH}
    volumes:
      - ./deploy/Caddyfile.hosted:/etc/caddy/Caddyfile:ro
    healthcheck:
      # Ready once the admin endpoint answers; certificates are obtained in the background.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']

  eudiplo:
    environment:
      PUBLIC_URL: https://${EUDIPLO_HOST}
      LOG_LEVEL: info
      # SQLite database (service.db) on its own volume, so sessions and status lists survive
      # restarts while the tenant config keeps coming from the image (git).
      FOLDER: /app/data
    volumes:
      - eudiplo-db:/app/data
      # Files that replace or add to the tenant config from git (scripts/eudiplo-entrypoint.sh).
      - ${QA_FIXTURES_DIR:?Set QA_FIXTURES_DIR}/overlay:/app/config-overlay:ro

  app:
    environment:
      PUBLIC_ORIGIN: https://${QA_HOST}
      REDIRECT_URI: https://${QA_HOST}/r/{sessionId}
      EUDIPLO_PUBLIC_URL: https://${EUDIPLO_HOST}
    volumes:
      - ${QA_FIXTURES_DIR}/public:/app/dist/public/trust:ro

volumes:
  eudiplo-db:
